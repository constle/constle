name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint & test the Go module.
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          # The tree is clean, so the whole module is linted rather than only
          # the lines a PR touches. only-new-issues was hiding a backlog that
          # had grown to 263 findings; with a zero baseline, linting
          # everything is what keeps it at zero.
          args: --timeout=5m

      # The generated Squid configuration is only a string to Go. A directive
      # this Squid does not accept satisfies every assertion in the suite and
      # then fails every run in the field, at startup, in the proxy the whole
      # sandbox depends on. Installing it here is what makes
      # TestGeneratedConfigParsesUnderRealSquid load-bearing rather than a
      # silent skip.
      - name: Install Squid (for the generated-config parse test)
        run: sudo apt-get update && sudo apt-get install -y squid

      # scripts/hygiene-check.sh reads the embedded metadata of binary and
      # media files through exiftool. The tests that hand it a real image
      # need the real reader and skip without it; installing it here is what
      # makes them load-bearing rather than a silent skip, as with Squid.
      - name: Install exiftool (for the hygiene metadata tests)
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl && exiftool -ver

      - name: Test
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Validate YAML spec files with relaxed line-length rules.
  # ---------------------------------------------------------------------------
  validate-spec:
    name: Validate Spec (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML spec files
        run: |
          yamllint -d "{
            extends: default,
            rules: {
              line-length: {max: 120, level: warning},
              document-start: disable,
              comments: {min-spaces-from-content: 1}
            }
          }" spec/

  # ---------------------------------------------------------------------------
  # Hygiene: scan the commits a PR would add with scripts/hygiene-check.sh.
  # The patterns are not in the repository; they come from the
  # HYGIENE_PATTERNS_B64 secret (the pattern file, base64-encoded so raw bytes
  # survive). Without it the job fails rather than scan for nothing — which
  # includes PRs from forks, which are not given secrets.
  # Scoped to the PR range rather than --all deliberately: it gates new
  # content without re-litigating history on every run.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The scan reads the embedded metadata of every binary or media file
      # the range adds or changes, and without exiftool it fails closed: a PR
      # that adds an image would fail here rather than pass unread.
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl && exiftool -ver

      # Invoked via `sh`, not ./: the script's exec bit was once lost on a
      # checkout where git could not see file modes (core.filemode=false),
      # and this job failed with "Permission denied" (exit 126) instead of
      # ever running the scan. The bit is now committed too, but the sh
      # invocation keeps this job immune to that class of regression.
      - name: Scan PR commits
        env:
          HYGIENE_PATTERNS_B64: ${{ secrets.HYGIENE_PATTERNS_B64 }}
        run: |
          if [ -z "$HYGIENE_PATTERNS_B64" ]; then
            echo "::error::the HYGIENE_PATTERNS_B64 secret is not available to this run"
            exit 2
          fi
          patterns="$RUNNER_TEMP/hygiene-patterns"
          printf '%s' "$HYGIENE_PATTERNS_B64" | base64 -d > "$patterns"
          CONSTLE_HYGIENE_PATTERNS="$patterns" sh scripts/hygiene-check.sh --range "origin/${{ github.base_ref }}..HEAD"

  # ---------------------------------------------------------------------------
  # Cross-platform build of the CLI binary.
  # ---------------------------------------------------------------------------
  build:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      # The installer regression tests live here rather than only in
      # lint-and-test because that job runs on ubuntu-latest alone. The Windows
      # leg is the only place scripts/install.ps1 runs under the Windows
      # PowerShell its own #Requires targets, and the macOS leg is the only
      # place the real shasum digest path and BSD mktemp are exercised - macOS
      # has no sha256sum at all. -v so that a leg which skipped everything
      # reads as skipped in the log rather than as a pass.
      - name: Test installers
        run: go test ./scripts/... -v

      - name: Verify binary runs
        run: go run ./cmd/constle version
