name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint & test the Go module.
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          # The tree is clean, so the whole module is linted rather than only
          # the lines a PR touches. only-new-issues was hiding a backlog that
          # had grown to 263 findings; with a zero baseline, linting
          # everything is what keeps it at zero.
          args: --timeout=5m

      - name: Test
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Validate YAML spec files with relaxed line-length rules.
  # ---------------------------------------------------------------------------
  validate-spec:
    name: Validate Spec (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML spec files
        run: |
          yamllint -d "{
            extends: default,
            rules: {
              line-length: {max: 120, level: warning},
              document-start: disable,
              comments: {min-spaces-from-content: 1}
            }
          }" spec/

  # ---------------------------------------------------------------------------
  # Hygiene: no AI-attribution trailers or unexpected script ranges in the
  # commits a PR would add. Generic patterns only — maintainer-private
  # patterns run in the local pre-push hook (see scripts/hygiene-check.sh).
  # Scoped to the PR range rather than --all deliberately: it gates new
  # content without re-litigating history on every run.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Hygiene (attribution & identity)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Invoked via `sh`, not ./: the script's exec bit was once lost on a
      # checkout where git could not see file modes (core.filemode=false),
      # and this job failed with "Permission denied" (exit 126) instead of
      # ever running the scan. The bit is now committed too, but the sh
      # invocation keeps this job immune to that class of regression.
      - name: Scan PR commits
        run: sh scripts/hygiene-check.sh --range "origin/${{ github.base_ref }}..HEAD"

  # ---------------------------------------------------------------------------
  # Cross-platform build of the CLI binary.
  # ---------------------------------------------------------------------------
  build:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Verify binary runs
        run: go run ./cmd/constle version
